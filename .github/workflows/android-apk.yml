name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (debug is debuggable, needed for run-as data pokes)'
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    name: Build APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Install the NDK the project pins
      run: |
        # The NDK zip is big and its download does flake; retry a few times.
        SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        for attempt in 1 2 3; do
          if yes | "$SDKMANAGER" --install "ndk;${NDK_VERSION}" \
              "platforms;android-34" "build-tools;34.0.0" >/tmp/sdkmanager.log 2>&1; then
            echo "sdkmanager ok on attempt ${attempt}"
            exit 0
          fi
          echo "sdkmanager failed on attempt ${attempt}:"
          tail -20 /tmp/sdkmanager.log
          sleep $((attempt * 15))
        done
        exit 1

    - name: Cache OpenSSL for Android
      id: cache-openssl
      uses: actions/cache@v6
      with:
        path: build-android-deps
        key: android-openssl-${{ hashFiles('tools/build-android-deps.sh') }}

    - name: Build OpenSSL for arm64
      if: steps.cache-openssl.outputs.cache-hit != 'true'
      run: |
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${NDK_VERSION}"
        tools/build-android-deps.sh arm64-v8a

    - name: Build the APK
      working-directory: android
      run: |
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${NDK_VERSION}"
        if [ "${{ inputs.variant }}" = "debug" ]; then
          ./gradlew :app:assembleDebug --no-daemon
        else
          ./gradlew :app:assembleRelease --no-daemon
        fi

    - name: Stage the APK
      run: |
        VARIANT="${{ inputs.variant }}"
        APK="android/app/build/outputs/apk/${VARIANT}/app-${VARIANT}.apk"
        test -f "${APK}" || APK="android/app/build/outputs/apk/${VARIANT}/app-${VARIANT}-unsigned.apk"
        cp "${APK}" "wowee-android-arm64-${VARIANT}.apk"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: wowee-android-arm64-apk-${{ inputs.variant }}
        path: wowee-android-arm64-${{ inputs.variant }}.apk
        if-no-files-found: error

    - name: Publish APK as a Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # One rolling tag so the download link never changes between builds.
        APK="wowee-android-arm64-${{ inputs.variant }}.apk"
        if gh release view apk-latest >/dev/null 2>&1; then
          gh release upload apk-latest "${APK}" --clobber
        else
          gh release create apk-latest "${APK}" \
            --title "Android APK (arm64)" \
            --notes "Instale o wowee-android-arm64-release.apk no Android (arm64, minSdk 33). Cada execucao do workflow substitui os APKs desta mesma pagina."
        fi
